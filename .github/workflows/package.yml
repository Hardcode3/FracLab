name: Package app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-latest
            artifact: fraclab-linux-x64
          - name: Windows x64
            runner: windows-latest
            artifact: fraclab-windows-x64
          - name: macOS Apple Silicon
            runner: macos-latest
            artifact: fraclab-macos-arm64
          - name: macOS Intel
            runner: macos-26-intel
            artifact: fraclab-macos-x64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build standalone application image
        run: mvn --batch-mode --no-transfer-progress -DskipTests clean javafx:jlink

      - name: Upload application bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/fraclab.zip
          if-no-files-found: error
          retention-days: 30

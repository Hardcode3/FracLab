name: Package app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-latest
            artifact: fraclab-linux-x64
          - name: Windows x64
            runner: windows-latest
            artifact: fraclab-windows-x64
          - name: macOS Apple Silicon
            runner: macos-latest
            artifact: fraclab-macos-arm64
          - name: macOS Intel
            runner: macos-26-intel
            artifact: fraclab-macos-x64

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Use the tag as the application version
        if: startsWith(github.ref, 'refs/tags/v')
        run: mvn --batch-mode --no-transfer-progress versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false

      # jpackage builds .msi installers with the WiX Toolset, which hosted Windows runners do not provide.
      - name: Install WiX Toolset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          $wix = "$env:USERPROFILE\.dotnet\tools"
          & "$wix\wix.exe" extension add --global WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2
          Add-Content -Path $env:GITHUB_PATH -Value $wix

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes fakeroot rpm

      - name: Test, then build the standalone application and installer
        run: |
          mvn --batch-mode --no-transfer-progress -Pdist clean package
          mkdir -p out && cp target/dist/* out/

      - name: Build the RPM package
        if: runner.os == 'Linux'
        run: |
          mvn --batch-mode --no-transfer-progress -Pdist -DskipTests -Dinstaller.type=rpm package
          cp target/dist/*.rpm out/

      # jpackage names .dmg and .msi files without the platform, so both Mac builds would clash in a release.
      - name: Add the platform to installer file names
        run: |
          cd out
          archive=$(ls FracLab-*.zip FracLab-*.tar.gz 2>/dev/null | head -n 1)
          stem=${archive%.zip}
          stem=${stem%.tar.gz}
          for file in *.dmg *.msi; do
            [ -e "$file" ] && mv "$file" "$stem.${file##*.}"
          done
          ls -l

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: out/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Draft GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" out/*
          --repo "$GITHUB_REPOSITORY"
          --title "FracLab ${GITHUB_REF_NAME#v}"
          --generate-notes
          --draft
